<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bugatti — HyperCars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Porsche+Next:wght@100;200;300;400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/style-marcas.css">
    <style>
      .brand-hero__bg{
      background-image: url("../../img/Bugatti/bolide04.jpg");
      }
    </style>
</head>
<body>

  <!-- NAVBAR  -->
  

  <main>

    <!-- HERO-->
    <section class="brand-hero" aria-label="Bugatti">
        <nav class="navbar">
            <a class="navbar-brand" href="../../index.html">
              <img src="../../img/logo01.png" alt="HyperCars">
              HYPERCARS
            </a>
        
            <div class="hc-drawer" id="hcDrawer">
              <button class="hc-close" onclick="toggleMenu()" aria-label="Fechar menu">✕</button>
              <ul>
                <li><a href="../../index.html">Início</a></li>
                <li><a href="../../index.html#marcas">Marcas</a></li>
                <li><a href="../../pages/modelos.html">Modelos</a></li>
                <li><a href="../../index.html#sobre">Sobre</a></li>
              </ul>
            </div>
        
            <button class="hc-toggler" onclick="toggleMenu()" aria-label="Abrir menu">
              <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
                <line x1="0" y1="1"  x2="18" y2="1"  stroke="white" stroke-width="1.5"/>
                <line x1="0" y1="7"  x2="18" y2="7"  stroke="white" stroke-width="1.5"/>
                <line x1="0" y1="13" x2="18" y2="13" stroke="white" stroke-width="1.5"/>
              </svg>
            </button>
          </nav>
      <div class="brand-hero__bg" id="heroBg"></div>
      <div class="brand-hero__vignette"></div>

      <div class="brand-hero__content">
        <span class="brand-hero__eyebrow">Marca · Bugatti · Molsheim, 1909</span>
        <img
          src="../../img/Bugatti/logo.png"
          alt="Bugatti"
          class="brand-hero__logo"
        >
        <div class="brand-hero__accent"></div>
        <h1 class="brand-hero__title">Bugatti</h1>
        <p class="brand-hero__subtitle">
          Onde a velocidade encontra a perfeição
        </p>
      </div>

      <div class="brand-hero__scroll" aria-hidden="true">
        <div class="brand-hero__scroll-line"></div>
        <span>Modelos</span>
      </div>
    </section>

    <!--MODELOS-->
    <section class="models-section" id="modelos">
        <div id="p1"></div><br>
        <div id="p2"></div>
    </section>

  </main>

  <footer>
    <p>© 2026 HyperCars. Todos os direitos reservados.</p>
  </footer>

  <script>
    // ── Menu drawer ────────────────────────────────────────
    function toggleMenu() {
      document.getElementById('hcDrawer').classList.toggle('open');
    }

    // ── Parallax suave no hero ─────────────────────────────
    const heroBg = document.getElementById('heroBg');
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      // Sutil: move o bg a 30% da velocidade do scroll
      if (y < window.innerHeight) {
        heroBg.style.transform = `scale(1.04) translateY(${y * 0.18}px)`;
      }
    }, { passive: true });

        // Função mágica que busca e injeta a seção
        function importarSecao(urlOrigem, idElemento, idDestino) {
            fetch(urlOrigem)
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Procura o elemento na página de origem
                    const secaoCopiada = doc.getElementById(idElemento); 
                    
                    if (secaoCopiada) {
                        // Injeta no container de destino da página atual
                        document.getElementById(idDestino).appendChild(secaoCopiada.cloneNode(true));
                    }
                })
                .catch(err => console.error(`Erro ao carregar do link ${urlOrigem}:`, err));
        }

        // --- COMO USAR: Chamar a função para cada página que quiser copiar ---
        document.addEventListener("DOMContentLoaded", () => {
            importarSecao('./pages/bugatti/bugatti.html', 'c1', 'p1');
            importarSecao('./pages/aston_martin/aston_martin.html', 'c2', 'p2');
            importarSecao('./pages/ferrari/ferrari.html', 'c3', 'p3');
            importarSecao('./pages/koenigsegg/koenigsegg.html', 'c4', 'p4');
            importarSecao('./pages/lamborghini/lamborghini.html', 'c5', 'p5');
            importarSecao('./pages/maserati/maserati.html', 'c6', 'p6');
            importarSecao('./pages/mclaren/mclaren.html', 'c7', 'p7');
            importarSecao('./pages/pagani/pagani.html', 'c8', 'p8');
            importarSecao('./pages/porsche/porsche.html', 'c9', 'p9');
            importarSecao('./pages/rollsroyce/rolls_royce.html', 'c10', 'p10');
        });
        

  </script>

</body>
</html>
